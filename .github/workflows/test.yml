name: Tests

# The SQL rule checks, plus a real run of every migration twice against a
# disposable Postgres to prove they are idempotent.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: app_password
          POSTGRES_DB: migrations_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      MIGRATIONS_TEST_DB: migrations_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund

      - run: npm test
